SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "Icons and small UI pieces from the pack; ui/wood from the pack's Godot example project, rescaled from x3 to x2 (2 UI units per art pixel; same pixels and colours) by tools/ui/rescale_skin.py on 28 Oct 2026."

[[annotations]]
path = ["assets/ui/rpg/**"]
SPDX-FileCopyrightText = "Kenney (Pixel UI Pack, Fantasy UI Borders, https://kenney.nl)"
SPDX-License-Identifier = "CC0-1.0"
