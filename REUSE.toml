# Where every asset comes from, and under which licence (REUSE 3.3 format, licence text in LICENSES/,
# https://reuse.software/spec-3.3/; the licence texts stay beside the packs: assets/LICENSE_*.txt,
# assets/ui/rpg/LICENSE_Kenney_*.txt, assets/fonts/PixelOperator_LICENSE.txt).
# tools/design/check.py (run by tools/run_tests.py) fails on any file under assets/ that no
# annotation covers, or whose licence is not in APPROVED_LICENSES there.
# Adding a source or a licence is the owner's decision (AGENTS.md "Ask the owner first",
# docs/art-bible.md "Sources"). Never import another pack's art.
version = 1

[[annotations]]
path = ["assets/characters/**", "assets/tiles/**", "assets/props/**", "assets/items/**", "assets/weapons/**", "assets/projectiles/**", "assets/fx/**"]
SPDX-FileCopyrightText = "Pixel-boy and AAA (Ninja Adventure asset pack, https://pixel-boy.itch.io/ninja-adventure-asset-pack)"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "World art. Pack sheets copied unchanged, or derived from them for this game (recoloured on the pack's ramps, re-sliced, combined; element effects drawn on the element ramps of docs/vfx.md with tools/vfx). Which pack sheet each tile atlas is: docs/art-bible.md \"Sources\"."

[[annotations]]
path = ["assets/ui/*.png", "assets/ui/emotes/**", "assets/ui/icons/**", "assets/ui/perks/**", "assets/ui/skills/**", "assets/ui/sphere/**", "assets/ui/synergies/**", "assets/ui/wood/**"]
